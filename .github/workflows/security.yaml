name: Security

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: tedilabs/github-actions/.github/actions/mise.setup-tools@main
      with:
        tool_versions: gitleaks 8.30.1
    - run: gitleaks git --redact --no-banner
