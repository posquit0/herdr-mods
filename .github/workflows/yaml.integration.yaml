name: Integration - YAML

on:
  push:
    branches: [main]
    paths: ["**.yaml", "**.yml"]
  pull_request:
    paths: ["**.yaml", "**.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-yaml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: tedilabs/github-actions/.github/workflows/yaml.yamllint.yaml@main
