name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_GITHUB_APP_CLIENT_ID != '' && secrets.RELEASE_GITHUB_APP_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Release Please with GitHub App
      if: env.HAS_RELEASE_APP == 'true'
      uses: tedilabs/github-actions/.github/actions/github.release-please@main
      with:
        github_app_client_id: ${{ secrets.RELEASE_GITHUB_APP_CLIENT_ID }}
        github_app_private_key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
    - name: Release Please with repository token
      if: env.HAS_RELEASE_APP != 'true'
      id: release
      uses: googleapis/release-please-action@v5
      with:
        token: ${{ github.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    - name: Check release pull requests created by the repository token
      if: env.HAS_RELEASE_APP != 'true' && steps.release.outputs.prs_created == 'true'
      env:
        RELEASE_PRS: ${{ steps.release.outputs.prs }}
      run: |
        while IFS= read -r branch; do
          gh workflow run checks.yml --ref "$branch"
        done < <(jq -r '.[].headBranchName' <<< "$RELEASE_PRS")
    - name: Publish each released mod
      run: |
        git fetch origin --tags
        for mod in floatterm analytics; do
          tag="$mod-v$(cat "$mod/VERSION")"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            continue
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
            continue
          fi
          gh release view "$tag" > /dev/null
          python3 scripts/package-mod.py "$mod"
          gh release upload "$tag" "dist/$mod.zip" "dist/$mod.zip.sha256" --clobber
        done
